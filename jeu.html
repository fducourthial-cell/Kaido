<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Dojo - Kaido</title>
    <link rel="icon" type="image/png" href="image/kaido_7.3.png">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        .quiz-container {
            max-width: 600px;
            margin: 2rem auto 5rem auto;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .question-text {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .target-country {
            color: var(--color-gold);
            font-size: 2.2rem;
            display: block;
            margin-top: 0.5rem;
        }

        .flags-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .flag-option {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 140px;
        }

        .flag-option img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .text-option {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-main);
            text-align: center;
            font-family: var(--font-kaido);
        }

        .flag-option:hover {
            border-color: var(--color-gold);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
        }

        .flag-option:hover img {
            transform: scale(1.05);
        }

        .flag-option.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
        }
        
        .flag-option.wrong {
            border-color: var(--color-torii);
            background: rgba(166, 58, 43, 0.1);
            opacity: 0.6;
        }

        #next-btn {
            display: none;
            margin: 2rem auto 0 auto;
            width: 100%;
            max-width: 300px;
        }

        .back-menu-btn {
            background: none;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 2rem;
            transition: all 0.2s;
        }
        .back-menu-btn:hover {
            color: var(--color-gold);
            border-color: var(--color-gold);
        }
    </style>
</head>
<body>

    <header class="kaido-header">
        <div class="header-left">
            <a href="index.html" class="header-btn-back">←</a>
        </div>
        <div class="header-center">
            <span style="font-family: var(--font-serif); font-size: 1.2rem; color: var(--color-gold); font-weight: bold;">Le Dojo de Kaido</span>
        </div>
        <div class="header-right"></div>
    </header>

    <main class="container">
        
        <!-- MENU DE SÉLECTION DU MODE -->
        <div id="mode-selection" class="quiz-container">
            <h2 style="font-family: var(--font-serif); color: var(--color-gold); margin-bottom: 2rem;">Choisissez votre entraînement</h2>
            
            <div class="flags-grid">
                <button class="flag-option mode-btn" data-mode="flags" style="flex-direction: column; height: auto; padding: 2rem;">
                    <span style="font-size: 3rem; margin-bottom: 1rem;">🏳️</span>
                    <strong style="font-size: 1.2rem; color: var(--text-main);">Drapeaux</strong>
                </button>
                <button class="flag-option mode-btn" data-mode="capitals" style="flex-direction: column; height: auto; padding: 2rem;">
                    <span style="font-size: 3rem; margin-bottom: 1rem;">🏛️</span>
                    <strong style="font-size: 1.2rem; color: var(--text-main);">Capitales</strong>
                </button>
                <button class="flag-option mode-btn" data-mode="currencies" style="flex-direction: column; height: auto; padding: 2rem;">
                    <span style="font-size: 3rem; margin-bottom: 1rem;">💶</span>
                    <strong style="font-size: 1.2rem; color: var(--text-main);">Monnaies</strong>
                </button>
                <button class="flag-option mode-btn" data-mode="mixed" style="flex-direction: column; height: auto; padding: 2rem;">
                    <span style="font-size: 3rem; margin-bottom: 1rem;">🎲</span>
                    <strong style="font-size: 1.2rem; color: var(--text-main);">Aléatoire</strong>
                </button>
            </div>
        </div>

        <!-- ZONE DE JEU (Masquée par défaut) -->
        <div id="quiz-area" class="quiz-container" style="display: none;">
            
            <div class="score-board">
                <span style="color: var(--text-muted);">Série actuelle : <span id="current-streak" style="color: var(--text-main);">0</span></span>
                <span style="color: var(--text-muted);">Meilleur score : <span id="best-score" style="color: var(--color-gold);">0</span> 🏆</span>
            </div>

            <h2 class="question-text">
                <span id="question-prefix">Sélectionnez le drapeau :</span>
                <span id="country-name" class="target-country">Chargement...</span>
            </h2>

            <div class="flags-grid" id="flags-container">
                <!-- Boutons générés en JS -->
            </div>

            <button id="next-btn" class="kaido-submit-btn" style="padding: 1rem; border-radius: 8px;">Continuer ➔</button>

            <button class="back-menu-btn" onclick="showMenu()">← Changer de mode</button>
        </div>

    </main>

        let currentQuestionMode = 'flags';
        let currentStreak = 0;
        let bestScore = localStorage.getItem('kaido_quiz_best') || 0;
        let correctCountry = null;
        let hasAnswered = false;
        let playlistPays = [];

        const menuEl = document.getElementById('mode-selection');
        const quizEl = document.getElementById('quiz-area');
        const countryNameEl = document.getElementById('country-name');
        const questionPrefixEl = document.getElementById('question-prefix');
        const flagsContainer = document.getElementById('flags-container');
        const nextBtn = document.getElementById('next-btn');
        const streakEl = document.getElementById('current-streak');
        const bestScoreEl = document.getElementById('best-score');

        bestScoreEl.textContent = bestScore;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function refillPlaylist() {
            playlistPays = shuffleArray([...countries]);
        }

        function showMenu() {
            quizEl.style.display = 'none';
            menuEl.style.display = 'block';
        }

        // Écouteurs sur les boutons du menu
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                gameMode = btn.getAttribute('data-mode');
                menuEl.style.display = 'none';
                quizEl.style.display = 'block';
                currentStreak = 0;
                streakEl.textContent = currentStreak;
                refillPlaylist();
                loadNewQuestion();
            });
        });

        function loadNewQuestion() {
            hasAnswered = false;
            nextBtn.style.display = 'none';
            flagsContainer.innerHTML = '';

            if (playlistPays.length === 0) refillPlaylist();
            
            correctCountry = playlistPays.pop();

            // Gestion du mode Aléatoire
            currentQuestionMode = gameMode;
            if (gameMode === 'mixed') {
                const modes = ['flags', 'capitals', 'currencies'];
                currentQuestionMode = modes[Math.floor(Math.random() * modes.length)];
            }

            // Mise à jour de la question
            if (currentQuestionMode === 'flags') {
                questionPrefixEl.textContent = "Sélectionnez le drapeau :";
            } else if (currentQuestionMode === 'capitals') {
                questionPrefixEl.textContent = "Quelle est la capitale de :";
            } else if (currentQuestionMode === 'currencies') {
                questionPrefixEl.textContent = "Quelle est la monnaie de :";
            }
            countryNameEl.textContent = correctCountry.name;

            // Pioche de 3 mauvaises réponses UNIQUES
            const wrongOptions = [];
            const fullListShuffled = shuffleArray([...countries]);

            for (let i = 0; i < fullListShuffled.length; i++) {
                const candidate = fullListShuffled[i];
                let isUnique = true;

                // Évite d'avoir la bonne réponse dans les mauvais choix
                if (candidate.code === correctCountry.code) isUnique = false;
                
                // Évite les doublons de réponses à l'écran (ex: deux fois "EUR")
                if (currentQuestionMode === 'capitals' && candidate.capital === correctCountry.capital) isUnique = false;
                if (currentQuestionMode === 'currencies' && candidate.currency === correctCountry.currency) isUnique = false;
                
                for(let w of wrongOptions) {
                    if (currentQuestionMode === 'capitals' && candidate.capital === w.capital) isUnique = false;
                    if (currentQuestionMode === 'currencies' && candidate.currency === w.currency) isUnique = false;
                }

                if (isUnique) {
                    wrongOptions.push(candidate);
                }
                if (wrongOptions.length === 3) break;
            }

            const options = shuffleArray([correctCountry, ...wrongOptions]);

            // Création des boutons de réponse
            options.forEach(country => {
                const btn = document.createElement('button');
                btn.className = 'flag-option';
                btn.dataset.code = country.code;
                
                if (currentQuestionMode === 'flags') {
                    btn.innerHTML = `<img src="https://flagcdn.com/w160/${country.code.toLowerCase()}.png" alt="Drapeau">`;
                } else if (currentQuestionMode === 'capitals') {
                    btn.innerHTML = `<span class="text-option">${country.capital}</span>`;
                } else if (currentQuestionMode === 'currencies') {
                    btn.innerHTML = `<span class="text-option">${country.currency}</span>`;
                }
                
                btn.addEventListener('click', () => handleAnswer(btn, country));
                flagsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn, selectedCountry) {
            if (hasAnswered) return;
            hasAnswered = true;

            const allButtons = document.querySelectorAll('.flag-option');

            if (selectedCountry.code === correctCountry.code) {
                selectedBtn.classList.add('correct');
                currentStreak++;
                
                if (currentStreak > bestScore) {
                    bestScore = currentStreak;
                    bestScoreEl.textContent = bestScore;
                    localStorage.setItem('kaido_quiz_best', bestScore);
                }
            } else {
                selectedBtn.classList.add('wrong');
                currentStreak = 0;
                
                // Montre la bonne réponse parmi les choix affichés
                allButtons.forEach(btn => {
                    if (btn.dataset.code === correctCountry.code) {
                        btn.classList.add('correct');
                    }
                });
            }

            streakEl.textContent = currentStreak;
            nextBtn.style.display = 'block';
        }

        nextBtn.addEventListener('click', loadNewQuestion);

    </script>
</body>
</html>
