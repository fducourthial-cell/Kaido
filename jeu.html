    <style>
        .quiz-container {
            max-width: 600px;
            margin: 2rem auto 5rem auto;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .question-text {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .target-country {
            color: var(--color-gold);
            font-size: 2.2rem;
            display: block;
            margin-top: 0.5rem;
        }

        .flags-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .flag-option {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 140px;
        }

        .flag-option img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .flag-option:hover {
            border-color: var(--color-gold);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
        }

        .flag-option:hover img {
            transform: scale(1.05);
        }

        /* Animations de réponse */
        .flag-option.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
        }
        .flag-option.wrong {
            border-color: var(--color-torii);
            background: rgba(166, 58, 43, 0.1);
            opacity: 0.6;
        }

        /* Bouton Rejouer / Suivant */
        #next-btn {
            display: none;
            margin: 2rem auto 0 auto;
            width: 100%;
            max-width: 300px;

let currentStreak = 0;
    let bestScore = localStorage.getItem('kaido_quiz_best') || 0;
    let correctCountry = null;
    let hasAnswered = false;
    let playlistPays = []; // La fameuse playlist

    const countryNameEl = document.getElementById('country-name');
    const flagsContainer = document.getElementById('flags-container');
    const nextBtn = document.getElementById('next-btn');
    const streakEl = document.getElementById('current-streak');
    const bestScoreEl = document.getElementById('best-score');

    bestScoreEl.textContent = bestScore;

    // Fonction pour mélanger un tableau
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function refillPlaylist() {
        // On copie le tableau de base et on le mélange pour faire une nouvelle playlist
        playlistPays = shuffleArray([...countries]);
    }

    function loadNewQuestion() {
        hasAnswered = false;
        nextBtn.style.display = 'none';
        flagsContainer.innerHTML = '';

        // Si la playlist est vide, on la recharge
        if (playlistPays.length === 0) {
            refillPlaylist();
        }

        // 1. On retire le dernier pays de la playlist : c'est notre bonne réponse
        correctCountry = playlistPays.pop();
        countryNameEl.textContent = correctCountry.name;

        // 2. On choisit 3 autres pays au hasard pour faire les mauvaises réponses
        const wrongOptions = [];
        const fullListShuffled = shuffleArray([...countries]);
        
        for (let i = 0; i < fullListShuffled.length; i++) {
            // On s'assure de ne pas piocher la bonne réponse comme mauvaise option
            if (fullListShuffled[i].code !== correctCountry.code) {
                wrongOptions.push(fullListShuffled[i]);
            }
            if (wrongOptions.length === 3) break;
        }

        // 3. On rassemble la bonne et les mauvaises réponses, et on les mélange
        const options = shuffleArray([correctCountry, ...wrongOptions]);

        // 4. On crée les 4 boutons
        options.forEach(country => {
            const btn = document.createElement('button');
            btn.className = 'flag-option';
            btn.innerHTML = `<img src="https://flagcdn.com/w160/${country.code.toLowerCase()}.png" alt="Drapeau caché">`;
            
            btn.addEventListener('click', () => handleAnswer(btn, country));
            flagsContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedBtn, selectedCountry) {
        if (hasAnswered) return; // Empêche de cliquer plusieurs fois
        hasAnswered = true;

        const allButtons = document.querySelectorAll('.flag-option');

        if (selectedCountry.code === correctCountry.code) {
            // Bonne réponse
            selectedBtn.classList.add('correct');
            currentStreak++;
            
            if (currentStreak > bestScore) {
                bestScore = currentStreak;
                bestScoreEl.textContent = bestScore;
                localStorage.setItem('kaido_quiz_best', bestScore);
            }
        } else {
            // Mauvaise réponse
            selectedBtn.classList.add('wrong');
            currentStreak = 0;
            
            // Mettre en surbrillance la bonne réponse pour montrer l'erreur
            allButtons.forEach(btn => {
                const imgUrl = btn.querySelector('img').src;
                if (imgUrl.includes(`/${correctCountry.code.toLowerCase()}.png`)) {
                    btn.classList.add('correct');
                }
            });
        }

        streakEl.textContent = currentStreak;
        nextBtn.style.display = 'block';
    }

    nextBtn.addEventListener('click', loadNewQuestion);

    // Lancer la première question
    loadNewQuestion();
