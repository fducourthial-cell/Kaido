<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes carnets de route - Kaido</title>
    <link rel="icon" type="image/png" href="image/logo kaido V4.png">

    <!-- CONFIGURATION PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D0B09">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image/logo kaido V4.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('✅ Service Worker enregistré avec succès !', reg.scope))
            .catch((err) => console.error('❌ Échec enregistrement Service Worker:', err));
        });
      }
    </script>

    <!-- 1. SDK CLIENT SUPABASE & CONFIGURATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <style>
        /* CODE COULEUR UNIVERSEL KAIDO */
        :root {
            --bg-dark: #0D0B09;
            --bg-card: #14110E;
            --color-gold: #D4AF37;
            --color-torii: #A63A2B;
            --text-main: #F4EFEA;
            --text-muted: #8E847A;
            --border-color: rgba(212, 175, 55, 0.08);
            --font-kaido: 'Plus Jakarta Sans', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-kaido);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            width: 92%;
            max-width: 1550px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* HEADER COMPACT AVEC LOGO CENTRÉ ET KAIDO ROUGE TORII */
        .kaido-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .kaido-header .brand-name {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--color-torii);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(166, 58, 43, 0.3);
            transition: all 0.3s ease;
        }

        .kaido-header .brand-name:hover {
            color: var(--color-gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .header-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 3px 10px rgba(212, 175, 55, 0.2));
            transition: transform 0.3s ease;
        }

        .header-logo:hover {
            transform: scale(1.05);
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        /* 👤 BOUTON PROFIL / IDENTIFIANT RESPONSIVE */
        .user-profile-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            color: var(--color-gold);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .user-profile-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--color-gold);
        }

        /* SECTION TITRE AVEC SOUS-TITRE JAPONAIS EN FILIGRANE */
        .dashboard-title-wrapper {
            margin: 2.5rem 0 2rem 0;
        }

        .dashboard-title {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Sous-titre japonais en filigrane doré */
        .dashboard-subtitle-jp {
            font-family: var(--font-kaido);
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--color-gold);
            opacity: 0.75;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* GRILLE DES CARTES */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
            padding-bottom: 4rem;
        }

        /* STRUCTURE STRICTE DE LA CARTE */
        .trip-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .trip-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.2);
        }

        .trip-banner {
            height: 200px;
            background-size: cover;
            background-position: center;
            background-color: #221e1a;
            position: relative;
        }

        .trip-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, var(--bg-card), transparent);
        }

        .trip-details {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .trip-details h3 {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .trip-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .trip-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        .trip-budget {
            color: var(--color-gold);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .trip-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-delete {
            background: rgba(166, 58, 43, 0.1);
            border: 1px solid rgba(166, 58, 43, 0.25);
            color: var(--color-torii);
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background: var(--color-torii);
            color: #ffffff;
            transform: scale(1.1);
        }

        .btn-view {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .btn-view:hover {
            color: var(--color-gold);
        }

        .create-trip-zone {
            border: 2px dashed rgba(212, 175, 55, 0.15);
            background: rgba(20, 17, 14, 0.4);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 2rem;
            text-align: center;
        }

        .create-trip-zone:hover {
            border-color: var(--color-gold);
            background: rgba(20, 17, 14, 0.7);
        }

        .create-trip-zone .plus-icon {
            font-size: 2.5rem;
            color: var(--color-gold);
            margin-bottom: 1rem;
        }

        .create-trip-zone h3 {
            color: var(--text-main);
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* 📱 MEDIA QUERIES MOBILE (MAX 768px) */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 0 1rem;
            }

            .kaido-header {
                grid-template-columns: auto 1fr auto;
                gap: 10px;
                padding: 0.8rem 0;
            }

            .header-logo {
                height: 65px;
            }

            .kaido-header .brand-name {
                font-size: 1.1rem;
                letter-spacing: 0.15em;
            }

            /* TRANSFORMATION DU BOUTON PROFIL EN ICÔNE RONDE SUR MOBILE */
            .user-profile-btn {
                padding: 0.5rem;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                justify-content: center;
            }

            .user-profile-btn span.user-name-text {
                display: none; /* Masque le texte du nom sur téléphone, garde l'icône */
            }

            .dashboard-title-wrapper {
                margin: 1.5rem 0 1.2rem 0;
                text-align: center;
            }

            .dashboard-title {
                font-size: 1.35rem;
                justify-content: center;
                flex-direction: column;
                gap: 0.2rem;
                line-height: 1.4;
            }

            .dashboard-subtitle-jp {
                font-size: 0.8rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
                padding-bottom: 2.5rem;
            }

            .trip-card, .create-trip-zone {
                min-height: 360px;
            }

            .trip-banner {
                height: 160px;
            }

            .trip-details {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRE DE NAVIGATION -->
        <header class="kaido-header">
            <div class="header-left">
                <a href="index.html" class="brand-name">KAIDO</a>
            </div>

            <div class="header-center">
                <a href="index.html">
                    <img src="image/logo kaido V4.png" alt="Logo Kaido" class="header-logo">
                </a>
            </div>

            <div class="header-right">
                <!-- BOUTON PROFIL RESPONSIVE -->
                <a href="#" class="user-profile-btn" title="Profil">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span class="user-name-text">F.DUCOURTHIAL</span>
                </a>
            </div>
        </header>

        <!-- TITRE PRINCIPAL ÉPURÉ AVEC PORTE ET SOUS-TITRE JAPONAIS -->
        <div class="dashboard-title-wrapper">
            <h1 class="dashboard-title">
                ⛩️ Mes futurs voyages 
                <span class="dashboard-subtitle-jp">旅 — Korekara no tabi</span>
            </h1>
        </div>

        <!-- GRILLE DE VOYAGES -->
        <section class="dashboard-grid" id="trips-grid">
            
            <!-- Zone fixe pour ajouter un voyage -->
            <a href="creer.html" class="create-trip-zone">
                <div class="plus-icon">+</div>
                <h3>Tracer une nouvelle route</h3>
            </a>

        </section>
    </div>

    <!-- LOGIQUE DE RENDU -->
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const grid = document.getElementById('trips-grid');
        
        if (grid) {
            const createZone = grid.querySelector('.create-trip-zone');

            // Fonction pour dessiner les cartes dans la grille
            const drawCards = (trips) => {
                const dynamicCards = grid.querySelectorAll('.dynamic-trip');
                dynamicCards.forEach(card => card.remove());

                trips.forEach(trip => {
                    const card = document.createElement('article');
                    card.className = 'trip-card dynamic-trip';
                    
                    const cityName = trip.destination || trip.title || 'Destination';
                    const finalImage = trip.image || 'https://images.pexels.com/photos/3278215/pexels-photo-3278215.jpeg?auto=compress&cs=tinysrgb&w=1200';

                    // Budget estimatif
                    let displayBudget = parseFloat(trip.budget) || 0;
                    if (displayBudget <= 0) {
                        let daysCount = 3;
                        if (trip.itinerary && trip.itinerary.length > 0) {
                            daysCount = trip.itinerary.length;
                        } else if (trip.dateStart && trip.dateEnd) {
                            const start = new Date(trip.dateStart);
                            const end = new Date(trip.dateEnd);
                            const diff = end.getTime() - start.getTime();
                            daysCount = Math.max(1, Math.ceil(diff / (1000 * 3600 * 24)) + 1);
                        }
                        displayBudget = (daysCount * 150) + 200;
                    }

                    card.innerHTML = `
                        <div class="trip-banner" style="background-image: url('${finalImage}');"></div>
                        <div class="trip-details">
                            <div>
                                <h3 style="font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #F4EFEA; margin-bottom: 0.5rem;">${cityName}</h3>
                                <p class="trip-meta">📅 ${trip.dates || 'Dates non définies'}</p>
                                ${trip.desc ? `<p style="margin-bottom: 1rem; color: #8E847A; font-size: 0.9rem;">${trip.desc}</p>` : ''}
                            </div>
                            
                            <div class="trip-footer">
                                <span class="trip-budget">~ ${displayBudget} €</span>
                                <div class="trip-actions">
                                    <button class="btn-delete" data-id="${trip.id}" title="Supprimer ce voyage">🗑️</button>
                                    <a href="voyage.html" class="btn-view" data-id="${trip.id}">VOIR L'ITINÉRAIRE →</a>
                                </div>
                            </div>
                        </div>
                    `;

                    const viewLink = card.querySelector('.btn-view');
                    if (viewLink) {
                        viewLink.addEventListener('click', () => {
                            localStorage.setItem('currentTrip', JSON.stringify(trip));
                            localStorage.setItem('kaido_active_trip', JSON.stringify(trip));
                        });
                    }
                    
                    if (createZone) {
                        grid.insertBefore(card, createZone);
                    } else {
                        grid.appendChild(card);
                    }
                });

                const deleteButtons = grid.querySelectorAll('.btn-delete');
                deleteButtons.forEach(button => {
                    button.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const tripId = button.getAttribute('data-id');
                        if (confirm("Êtes-vous sûr de vouloir supprimer cet itinéraire de Kaido ?")) {
                            await deleteTrip(tripId);
                        }
                    });
                });
            };

            const renderTrips = async () => {
                let localTrips = JSON.parse(localStorage.getItem('kaido_trips')) || [];
                drawCards(localTrips);

                if (typeof supabase !== 'undefined') {
                    try {
                        const { data: { user } } = await supabase.auth.getUser();

                        const { data: cloudTrips, error } = await supabase
                            .from('trips')
                            .select('*')
                            .order('created_at', { ascending: false });

                        if (!error && cloudTrips) {
                            const cloudIds = new Set(cloudTrips.map(ct => String(ct.id)));

                            if (user) {
                                for (const localTrip of localTrips) {
                                    if (!cloudIds.has(String(localTrip.id))) {
                                        const { data: inserted, error: insertErr } = await supabase
                                            .from('trips')
                                            .insert([{
                                                user_id: user.id,
                                                title: localTrip.destination || localTrip.title,
                                                destination: localTrip.destination || localTrip.title,
                                                departure: localTrip.departure || 'Paris',
                                                date_start: localTrip.dateStart || null,
                                                date_end: localTrip.dateEnd || null,
                                                budget: localTrip.budget || 0,
                                                desc_text: localTrip.desc || '',
                                                image: localTrip.image || '',
                                                destination_lat: localTrip.destinationLat || null,
                                                destination_lng: localTrip.destinationLng || null,
                                                itinerary: localTrip.itinerary || [],
                                                checklist: localTrip.checklist || []
                                            }])
                                            .select();

                                        if (!insertErr && inserted && inserted[0]) {
                                            localTrip.id = inserted[0].id;
                                        }
                                    }
                                }
                            }

                            const formattedCloud = cloudTrips.map(ct => ({
                                id: ct.id,
                                title: ct.title,
                                destination: ct.destination,
                                departure: ct.departure,
                                dateStart: ct.date_start,
                                dateEnd: ct.date_end,
                                dates: `${ct.date_start || ''} au ${ct.date_end || ''}`,
                                budget: ct.budget,
                                desc: ct.desc_text,
                                image: ct.image,
                                destinationLat: ct.destination_lat,
                                destinationLng: ct.destination_lng,
                                itinerary: ct.itinerary,
                                checklist: ct.checklist
                            }));

                            const mergedMap = new Map();
                            localTrips.forEach(t => mergedMap.set(String(t.id), t));
                            formattedCloud.forEach(t => mergedMap.set(String(t.id), t));

                            const mergedTrips = Array.from(mergedMap.values());
                            
                            localStorage.setItem('kaido_trips', JSON.stringify(mergedTrips));
                            drawCards(mergedTrips);
                        }
                    } catch (e) {
                        console.warn("Maintien de l'affichage local (mode hors-ligne actif).", e);
                    }
                }
            };

            const deleteTrip = async (id) => {
                if (typeof supabase !== 'undefined') {
                    try {
                        await supabase.from('trips').delete().eq('id', id);
                    } catch (err) {
                        console.warn("Suppression Cloud échouée, suppression locale effectuée.");
                    }
                }

                let customTrips = JSON.parse(localStorage.getItem('kaido_trips')) || [];
                customTrips = customTrips.filter(trip => String(trip.id) !== String(id));
                localStorage.setItem('kaido_trips', JSON.stringify(customTrips));
                
                const activeTrip = JSON.parse(localStorage.getItem('kaido_active_trip'));
                if (activeTrip && String(activeTrip.id) === String(id)) {
                    localStorage.removeItem('kaido_active_trip');
                    localStorage.removeItem('currentTrip');
                }
                
                await renderTrips();
            };

            await renderTrips();
        }
    });
    </script>
</body>
</html>
