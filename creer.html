<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracer une nouvelle route - Kaido</title>
    <link rel="icon" type="image/png" href="image/logo kaido V4.png">

    <!-- CONFIGURATION PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D0B09">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="image/logo kaido V4.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('✅ Service Worker enregistré avec succès !', reg.scope))
            .catch((err) => console.error('❌ Échec enregistrement Service Worker:', err));
        });
      }
    </script>
    
    <!-- SDK CLIENT SUPABASE & CONFIGURATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

    <div class="container">
        <header class="kaido-header">
            <a href="index.html" style="display: flex; align-items: center; justify-content: center;">
                <img src="image/logo kaido V4.png" alt="Kaido Logo" class="header-logo-center">
            </a>
        </header>

        <section class="create-hero">
            <h1>Tracer une nouvelle route</h1>
            <p>L'intelligence de Kaido conçoit votre carnet de voyage sur-mesure.</p>
        </section>

        <main class="kaido-form-box">
            <form id="create-trip-form">
                <div class="form-group">
                    <label for="trip-departure">🛫 Ville de départ</label>
                    <input type="text" id="trip-departure" class="form-control" placeholder="Ex: Paris, Édimbourg, Lyon..." required>
                </div>

                <div class="form-group">
                    <label for="trip-destination-modern">📍 Destination de vos rêves</label>
                    <gmp-place-autocomplete id="trip-destination-modern" placeholder="Ex: Écosse, Tokyo, Islande, Toscane..."></gmp-place-autocomplete>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="trip-date-start">📅 Date Aller</label>
                        <input type="date" id="trip-date-start" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="trip-date-end">📅 Date Retour</label>
                        <input type="date" id="trip-date-end" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="trip-budget-input">💶 Budget Max estimé (Optionnel)</label>
                    <input type="number" id="trip-budget-input" class="form-control" placeholder="Ex: 1500" min="0">
                </div>

                <div class="form-group">
                    <label for="trip-notes">📝 Notes, mode de transport & envies de voyage</label>
                    <textarea id="trip-notes" class="form-control" rows="4" placeholder="Ex: Centres d'intérêt, moyen de transport, activités spécifiques..."></textarea>
                </div>

                <button type="submit" class="kaido-submit-btn">
                    ✨ Concevoir mon itinéraire sur-mesure
                </button>
            </form>
        </main>
    </div>

    <!-- OVERLAY DE CHARGEMENT ROTATIF -->
    <div id="kaido-loader-overlay">
        <img src="image/logo kaido V4.png" alt="Kaido Loading" class="loader-logo-spin">
        <div class="loader-text-title">Tracer votre route...</div>
        <div class="loader-text-subtitle">L'intelligence de Kaido conçoit votre carnet de voyage sur-mesure. Veuillez patienter.</div>
    </div>

    <div id="hidden-places-helper" style="display:none;"></div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBtCPxmMm2O7dRTpSw2ZxrhfzggQv7LBU0&libraries=places&v=weekly&loading=async" defer></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('create-trip-form');
        const modernField = document.getElementById('trip-destination-modern');
        const NETLIFY_ENDPOINT = 'https://quiet-hamster-f904c2.netlify.app/.netlify/functions/generate-trip';

        let selectedDestinationName = "";
        let placesService = null;

        function getPlacesService() {
            if (!placesService && typeof google !== 'undefined' && google.maps && google.maps.places) {
                placesService = new google.maps.places.PlacesService(document.getElementById('hidden-places-helper'));
            }
            return placesService;
        }

        function buildFallbackImage(name) {
            const initial = (name || '?').trim().charAt(0).toUpperCase();
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600">
                    <defs>
                        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#A63A2B"/>
                            <stop offset="100%" stop-color="#0D0B09"/>
                        </linearGradient>
                    </defs>
                    <rect width="1200" height="600" fill="url(#g)"/>
                    <text x="50%" y="52%" font-family="Georgia, serif" font-size="220" fill="#D4AF37" fill-opacity="0.35" text-anchor="middle" dominant-baseline="middle">${initial}</text>
                </svg>`;
            return `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
        }

        function getDestinationInfo(destinationName) {
            return new Promise((resolve) => {
                const service = getPlacesService();
                if (!service || !destinationName) {
                    resolve({ image: buildFallbackImage(destinationName), lat: null, lng: null });
                    return;
                }

                service.findPlaceFromQuery(
                    { query: destinationName, fields: ['photos', 'name', 'geometry'] },
                    (results, status) => {
                        if (status === google.maps.places.PlacesServiceStatus.OK && results && results[0]) {
                            const place = results[0];
                            const image = (place.photos && place.photos.length > 0)
                                ? place.photos[0].getUrl({ maxWidth: 1200, maxHeight: 600 })
                                : buildFallbackImage(destinationName);
                            const lat = (place.geometry && place.geometry.location) ? place.geometry.location.lat() : null;
                            const lng = (place.geometry && place.geometry.location) ? place.geometry.location.lng() : null;
                            resolve({ image, lat, lng });
                        } else {
                            resolve({ image: buildFallbackImage(destinationName), lat: null, lng: null });
                        }
                    }
                );
            });
        }

        if (modernField) {
            modernField.addEventListener('gmp-placeselect', (event) => {
                const place = event.detail.place;
                if (place) {
                    selectedDestinationName = place.displayName || place.formattedAddress || place.name || "";
                }
            });
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn ? submitBtn.textContent : "Concevoir mon itinéraire";

                const loaderOverlay = document.getElementById('kaido-loader-overlay');
                if (loaderOverlay) loaderOverlay.style.display = 'flex';

                try {
                    let destinationText = "";
                    if (modernField) {
                        if (typeof modernField.value === 'string' && modernField.value.trim() !== '') {
                            destinationText = modernField.value;
                        } else if (typeof modernField.value === 'object' && modernField.value !== null) {
                            destinationText = modernField.value.displayName || modernField.value.formattedAddress || modernField.value.name || "";
                        }
                        if (!destinationText) {
                            const innerInput = modernField.shadowRoot ? modernField.shadowRoot.querySelector('input') : modernField.querySelector('input');
                            if (innerInput && innerInput.value) destinationText = innerInput.value;
                        }
                    }
                    if (!destinationText) {
                        const backupInput = document.getElementById('trip-destination');
                        if (backupInput) destinationText = backupInput.value;
                    }

                    const cleanDestination = String(destinationText || selectedDestinationName).trim();
                    if (!cleanDestination) {
                        alert("Veuillez sélectionner ou saisir une destination de voyage.");
                        if (loaderOverlay) loaderOverlay.style.display = 'none';
                        return;
                    }

                    const departureInput = document.getElementById('trip-departure');
                    const departure = departureInput ? departureInput.value : 'Paris';
                    const dateStart = document.getElementById('trip-date-start').value;
                    const dateEnd = document.getElementById('trip-date-end').value;
                    const budgetInput = document.getElementById('trip-budget-input');
                    const userBudget = budgetInput ? parseFloat(budgetInput.value) : 0;
                    const notesInput = document.getElementById('trip-notes');
                    const desc = notesInput ? notesInput.value : '';

                    if (!dateStart || !dateEnd) {
                        alert("Veuillez renseigner les dates aller et retour.");
                        if (loaderOverlay) loaderOverlay.style.display = 'none';
                        return;
                    }

                    if (submitBtn) {
                        submitBtn.textContent = "🧠 L'IA conçoit votre voyage...";
                        submitBtn.disabled = true;
                    }

                    const start = new Date(dateStart);
                    const end = new Date(dateEnd);
                    const timeDiff = end.getTime() - start.getTime();
                    const totalDays = Math.ceil(timeDiff / (1000 * 3600 * 24)) + 1;

                    if (totalDays <= 0) {
                        alert("La date de retour doit être après la date de départ !");
                        if (loaderOverlay) loaderOverlay.style.display = 'none';
                        if (submitBtn) { submitBtn.textContent = originalBtnText; submitBtn.disabled = false; }
                        return;
                    }

                    // 1. Appel Netlify pour l'itinéraire riche et la checklist spécifique par IA
                    const response = await fetch(NETLIFY_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            destination: cleanDestination,
                            departure: departure,
                            totalDays: totalDays,
                            descText: desc
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || "Erreur de génération par l'IA Netlify.");
                    }

                    const aiData = await response.json();
                    const formatDate = (d) => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;

                    const formattedItinerary = (aiData.itinerary || []).map((dayObj, index) => {
                        const currentDate = new Date(start);
                        currentDate.setDate(start.getDate() + index);
                        return {
                            day: dayObj.day || `Jour ${index + 1}`,
                            dateText: formatDate(currentDate),
                            steps: (dayObj.steps || []).map(step => ({
                                time: step.time || "10:00",
                                activity: step.activity || step.title || "Activité",
                                location: step.location || cleanDestination,
                                lat: null,
                                lng: null
                            }))
                        };
                    });

                    const formattedChecklist = (aiData.checklist || []).map((item, idx) => ({
                        id: Date.now() + idx,
                        text: item,
                        done: false
                    }));

                    // 2. Infos photo & géolocalisation
                    const destInfo = await getDestinationInfo(cleanDestination);

                    // 3. Calcul de notre budget intelligent
                    const calculatedBudget = calculateSmartBudget(cleanDestination, totalDays, desc, userBudget);

                    const newTrip = {
                        id: Date.now(),
                        title: cleanDestination,
                        destination: cleanDestination,
                        destinationLat: destInfo.lat,
                        destinationLng: destInfo.lng,
                        departure: departure,
                        dates: `${formattedItinerary[0].dateText} au ${formattedItinerary[formattedItinerary.length - 1].dateText}`,
                        dateStart: dateStart,
                        dateEnd: dateEnd,
                        budget: calculatedBudget.total,
                        budgetDetails: calculatedBudget,
                        desc: desc,
                        image: destInfo.image,
                        itinerary: formattedItinerary,
                        checklist: formattedChecklist,
                        expenses: []
                    };

                    const currentTrips = JSON.parse(localStorage.getItem('kaido_trips')) || [];
                    currentTrips.push(newTrip);
                    localStorage.setItem('kaido_trips', JSON.stringify(currentTrips));
                    localStorage.setItem('kaido_active_trip', JSON.stringify(newTrip));

                    window.location.href = 'voyage.html';

                } catch (error) {
                    console.error(error);
                    if (loaderOverlay) loaderOverlay.style.display = 'none';
                    alert("Erreur lors de la création : " + error.message);
                    if (submitBtn) { submitBtn.textContent = originalBtnText; submitBtn.disabled = false; }
                }
            });
        }
    });

    // MOTEUR DE CALCUL BUDGÉTAIRE INTELLIGENT
    function calculateSmartBudget(destination, totalDays, notes, userBudget) {
        const destLower = destination.toLowerCase();
        const notesLower = notes.toLowerCase();

        let dailyCostPerPerson = 90;
        let baseFlightCost = 250;

        if (destLower.includes('islande') || destLower.includes('suisse') || destLower.includes('norvège') || destLower.includes('japon') || destLower.includes('tokyo') || destLower.includes('new york')) {
            dailyCostPerPerson = 160;
            baseFlightCost = 600;
        } else if (destLower.includes('asie') || destLower.includes('thaïlande') || destLower.includes('vietnam') || destLower.includes('indonésie') || destLower.includes('maroc')) {
            dailyCostPerPerson = 45;
            baseFlightCost = 500;
        }

        const isRoadTrip = notesLower.includes('road') || notesLower.includes('voiture') || notesLower.includes('camion') || notesLower.includes('louer') || notesLower.includes('véhicule');
        let carRentalTotal = isRoadTrip ? (totalDays * 65) : 0;

        const lodgingAndFood = totalDays * dailyCostPerPerson;
        const transportTotal = baseFlightCost + carRentalTotal;
        
        let estimatedTotal = lodgingAndFood + transportTotal;
        if (userBudget && userBudget > 0) estimatedTotal = userBudget;

        const flightsPart = Math.round(transportTotal * 0.7);
        const hotelPart = Math.round(lodgingAndFood * 0.55);
        const restPart = estimatedTotal - (flightsPart + hotelPart);

        return {
            total: Math.round(estimatedTotal),
            flights: Math.max(50, flightsPart),
            hotel: Math.max(50, hotelPart),
            rest: Math.max(50, restPart),
            isRoadTrip: isRoadTrip
        };
    }
    </script>
</body>
</html>
