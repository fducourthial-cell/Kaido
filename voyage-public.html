<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Voyage - Kaido</title>
    <link rel="icon" type="image/png" href="image/logo kaido v7.2.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- SDK CLIENT SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- EN-TÊTE PUBLIC ÉPURÉ -->
    <header class="kaido-header">
        <div class="header-left">
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Carnet de route partagé</span>
        </div>
        <div class="header-center">
            <img src="image/logo kaido v7.2.png" alt="Logo Kaido" class="header-logo">
        </div>
        <div class="header-right">
            <!-- Bouton pour basculer le thème si le visiteur le souhaite -->
            <button id="global-theme-toggle" type="button" title="Changer de thème" style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--color-gold); cursor: pointer;">🌓</button>
        </div>
    </header>

    <main class="container" style="margin-top: 1.5rem; padding-bottom: 4rem;">

        <!-- TITRE DU VOYAGE -->
        <div style="margin-bottom: 1.5rem; text-align: center;">
            <h1 id="public-trip-title" style="font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0; color: var(--text-main);">Chargement de l'aventure...</h1>
            <p id="public-trip-dates" style="color: var(--color-gold); font-weight: 600; margin: 0.3rem 0 0 0; font-size: 0.95rem;">📅 --/--/---- au --/--/----</p>
            <p id="public-trip-desc" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; max-width: 600px; margin-left: auto; margin-right: auto;"></p>
        </div>

        <!-- CONTENU EN MODE LECTURE SEULE -->
        <div class="itinerary-split-layout">
            
            <!-- COLONNE ITINÉRAIRE (Étapes des jours) -->
            <div class="itinerary-list-col" style="width: 100%;">
                <div id="public-days-container">
                    <!-- Les étapes du voyage injectées par JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE CHARGEMENT PUBLIC VIA LE TOKEN -->
    <script>
        // Gestion basique du thème sombre / papyrus pour les visiteurs
        const toggleBtn = document.getElementById('global-theme-toggle');
        const currentTheme = localStorage.getItem('kaido_theme') || 'dark';
        document.body.setAttribute('data-theme', currentTheme);

        toggleBtn.addEventListener('click', () => {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'papyrus' ? 'dark' : 'papyrus';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('kaido_theme', next);
        });

        // Chargement sécurisé des données du voyage via Supabase RPC
        async function loadSharedTrip() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const titleEl = document.getElementById('public-trip-title');
            const datesEl = document.getElementById('public-trip-dates');
            const descEl = document.getElementById('public-trip-desc');
            const container = document.getElementById('public-days-container');

            if (!token) {
                titleEl.textContent = "Lien de partage invalide";
                datesEl.textContent = "";
                descEl.textContent = "Aucun identifiant de voyage n'a été fourni dans ce lien.";
                return;
            }

            try {
                // Appel de la fonction sécurisée Supabase créée à l'étape 2
                const { data, error } = await supabase.rpc('get_shared_trip', { token: token });

                if (error || !data || data.length === 0) {
                    titleEl.textContent = "Voyage introuvable";
                    datesEl.textContent = "";
                    descEl.textContent = "Ce carnet de route n'existe pas ou le lien a expiré.";
                    return;
                }

                const trip = data[0];

                // Remplissage des infos principales
                titleEl.textContent = `${trip.destination || 'Voyage'} (${trip.country || ''})`;
                datesEl.textContent = `📅 Du ${trip.date_start} au ${trip.date_end}`;
                if (trip.description) {
                    descEl.textContent = trip.description;
                }

                // Remplissage de l'itinéraire (si stocké en JSON dans ta base)
                if (trip.itinerary && Array.isArray(trip.itinerary)) {
                    container.innerHTML = '';
                    trip.itinerary.forEach((day, index) => {
                        let stepsHtml = '';
                        if (day.steps && Array.isArray(day.steps)) {
                            day.steps.forEach(step => {
                                stepsHtml += `
                                    <div class="step-item" style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 1rem; border-radius: 6px; margin-bottom: 0.8rem;">
                                        <h3 style="font-size: 1rem; color: var(--text-main); margin: 0 0 0.3rem 0;">${step.title || 'Étape'}</h3>
                                        <div style="font-size: 0.85rem; color: var(--text-muted);">${step.notes || ''}</div>
                                    </div>
                                `;
                            });
                        }

                        container.innerHTML += `
                            <div class="day-block-card" style="margin-bottom: 1.5rem; background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 8px;">
                                <div class="day-header" style="font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--color-gold); margin-bottom: 1rem; font-weight: 600;">
                                    Jour ${index + 1} - ${day.date || ''}
                                </div>
                                <div class="day-steps-list">
                                    ${stepsHtml || '<p style="color: var(--text-muted); font-size: 0.85rem;">Aucune étape détaillée pour ce jour.</p>'}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Aucun itinéraire détaillé disponible pour le moment.</p>`;
                }

            } catch (err) {
                console.error("Erreur de chargement :", err);
                titleEl.textContent = "Erreur de connexion";
                descEl.textContent = "Impossible de récupérer les données du voyage.";
            }
        }

        // Lancement au chargement de la page
        window.addEventListener('DOMContentLoaded', loadSharedTrip);
    </script>
</body>
</html>
